plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}
version = project.mod_version
group = project.mod_group
base { archivesName = 'shine' }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
minecraft {
    mappings channel: 'official', version: '1.20.1'
    copyIdeResources = true
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods { shine { source sourceSets.main } }
        }
        client { }
        server { args '--nogui' }
    }
}
repositories { maven { url = 'https://maven.minecraftforge.net' }; mavenCentral() }
dependencies { minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}" }
sourceSets.main.resources { srcDir 'src/generated/resources' }
jar { manifest { attributes(['Specification-Title':'Shine','Specification-Vendor':'Backport workspace','Specification-Version':'1','Implementation-Title':project.name,'Implementation-Version':project.version]) } }
